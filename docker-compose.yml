version: '3.8'

services:
  # Application BrokerX Web Interface avec base H2 embarquée
  brokerx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brokerx-web
    environment:
      # Configuration application web
      SPRING_PROFILES_ACTIVE: "docker"
      SERVER_PORT: "8081"
      LOG_LEVEL: "INFO"
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
      
      # Configuration H2 Database embarquée
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/brokerx;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE"
      SPRING_DATASOURCE_USERNAME: "brokerx"
      SPRING_DATASOURCE_PASSWORD: "brokerx"
      SPRING_H2_CONSOLE_ENABLED: "true"
      
      # Seed data activé
      DB_SEED: "true"
    volumes:
      - brokerx_data:/app/data
      - brokerx_logs:/app/logs
    ports:
      - "8081:8081"  # Application web Spring Boot
    networks:
      - brokerx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

# Volumes persistants pour les données
volumes:
  brokerx_data:
    driver: local
  brokerx_logs:
    driver: local

# Réseau pour la communication inter-services
networks:
  brokerx-network:
    driver: bridge