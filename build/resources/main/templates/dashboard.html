<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - BrokerX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h1 class="card-title text-success">🎉 Bienvenue !</h1>
                        <p class="card-text">Connexion réussie à BrokerX</p>
                        
                        <div class="mt-4">
                            <h5>Informations utilisateur :</h5>
                            <p><strong>Email :</strong> <span th:text="${client.email}">N/A</span></p>
                            <p><strong>Nom :</strong> <span th:text="${client.prenom + ' ' + client.nom}">N/A</span></p>
                            <p><strong>Statut :</strong> <span class="badge bg-success" th:text="${client.statusInscription}">ACTIF</span></p>
                        </div>
                        
                        <div class="mt-4">
                            <a href="/mfa-config" class="btn btn-primary me-2">⚙️ Configuration MFA</a>
                            <a href="/deconnexion" class="btn btn-outline-secondary">🚪 Déconnexion</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
