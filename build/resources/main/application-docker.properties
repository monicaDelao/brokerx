# Configuration BrokerX pour environnement Docker
# Profil activé avec SPRING_PROFILES_ACTIVE=docker

# Configuration serveur
server.port=8081
server.servlet.context-path=/

# Configuration de la base de données H2 embarquée (persistante en volume Docker)
spring.datasource.url=jdbc:h2:file:/app/data/brokerx;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=brokerx
spring.datasource.password=brokerx
spring.datasource.driver-class-name=org.h2.Driver

# Configuration JPA/Hibernate pour Docker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Console H2 pour développement Docker
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Boot Actuator pour healthcheck Docker
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.server.port=8081

# Logging pour Docker
logging.level.brokerx=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Configuration sécurisée pour Docker
spring.security.user.name=admin
spring.security.user.password={noop}docker123!
spring.security.user.roles=ADMIN

# Seed data activé pour démonstration
app.seed.enabled=true