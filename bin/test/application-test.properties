# Configuration de test pour BrokerX
# Profil activé dans les tests automatisés

# Configuration H2 pour tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration pour tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuration H2 Console (désactivée en test)
spring.h2.console.enabled=false

# Configuration Actuator pour monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Configuration de logging pour tests
logging.level.com.brokerx=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Configuration serveur pour tests
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always