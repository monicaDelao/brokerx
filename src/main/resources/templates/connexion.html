<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Connexion - BrokerX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(33, 150, 243, 0.3);
        }
        
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .register-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .info-box h4 {
            color: #1565c0;
            margin-bottom: 10px;
        }
        
        .info-box p {
            color: #1976d2;
            font-size: 0.9em;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Retour à l'accueil</a>
        
        <div class="header">
            <div class="logo">🏦 BrokerX</div>
            <div class="subtitle">Connexion à votre compte</div>
        </div>
        
        <!-- Messages d'erreur -->
        <div th:if="${error}" class="error-box" style="background: #ffebee; border: 1px solid #f44336; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center;">
            <div style="color: #d32f2f; font-weight: 600;" th:text="${error}">Message d'erreur</div>
        </div>
        
        <!-- Messages de succès -->
        <div th:if="${message}" class="success-box" style="background: #e8f5e8; border: 1px solid #4caf50; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center;">
            <div style="color: #2e7d32; font-weight: 600;" th:text="${message}">Message de succès</div>
        </div>
        
        <form method="post" th:action="@{/connexion}">
            <div class="form-group">
                <label for="email">Adresse email *</label>
                <input type="email" id="email" name="email" 
                       th:value="${email}" 
                       required 
                       placeholder="votre@email.com"
                       autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="motDePasse">Mot de passe *</label>
                <input type="password" id="motDePasse" name="motDePasse" 
                       required 
                       placeholder="Entrez votre mot de passe"
                       autocomplete="current-password"
                       minlength="8">
            </div>
            
            <button type="submit" class="submit-btn">
                CONNEXION Se connecter
            </button>
        </form>
        
        <div class="register-link">
            <p>Pas encore de compte ? 
               <a href="/inscription">Créer un compte gratuitement</a>
            </p>
        </div>
    </div>
    
    <!-- UC-02 Authentification - Formulaire fonctionnel -->
    <script>
        // Amélioration UX - Focus automatique sur le champ email
        document.addEventListener('DOMContentLoaded', function() {
            const emailField = document.getElementById('email');
            if (emailField && !emailField.value) {
                emailField.focus();
            }
        });
        
        // Validation côté client pour une meilleure UX
        document.querySelector('form').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('motDePasse').value;
            
            if (!email || !password) {
                e.preventDefault();
                alert('Veuillez remplir tous les champs obligatoires.');
                return false;
            }
            
            if (password.length < 8) {
                e.preventDefault();
                alert('Le mot de passe doit contenir au moins 8 caractères.');
                return false;
            }
            
            // Log pour debug (UC-02 Step 1)
            console.log('UC-02 Step 1: Client saisit identifiant/mot de passe');
            console.log('Email:', email);
        });
    </script>
</body>
</html>
